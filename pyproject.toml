[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "polars>=1.35.2",
    "pre-commit>=4.6.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# pyhealth pins numpy>=2.2; femr (via nptyping) pins numpy<2. The two stacks
# cannot share an environment, so they are declared as conflicting extras.
eda = [
    "plotly>=6.9.0",
    "pyhealth>=2.0.1",
    "streamlit>=1.58.0",
]
modelling = [
    "femr>=0.2.4",
    "meds==0.3.3",
    "meds-etl[cpp]==0.3.11",
    "meds-reader>=0.1.16",
]

[tool.uv]
conflicts = [[{ extra = "eda" }, { extra = "modelling" }]]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
"**/dashboard.py" = ["E402"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "eda: needs the eda extra (pyhealth/streamlit/plotly); auto-applied by tests/conftest.py.",
    "modelling: needs the modelling extra (meds-etl/femr); auto-applied by tests/conftest.py.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
