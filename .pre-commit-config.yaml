repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18  # autoupdate fills this in
    hooks:
      - id: ruff          # lint
        args: [--fix]
      - id: ruff-format   # format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # 23 GB of checkpoints reached the index once; the largest file worth
      # versioning here is a 13 MB adapter.
      - id: check-added-large-files
        args: [--maxkb=25600]
